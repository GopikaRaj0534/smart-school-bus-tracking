services:
  db:
    image: mysql:8.0
    container_name: routesafe_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-routesafe_db}
      MYSQL_USER: ${MYSQL_USER:-routesafe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-routesafe_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-routesafe_root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routesafe_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
